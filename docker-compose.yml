# NAJDA: the whole stack on one machine (Postgres + backend + web).
#
#   cp .env.example .env                       # Postgres credentials + the web app's public build settings
#   cp backend/.env.example backend/.env       # backend secrets (Firebase, Supabase, OpenRouter, Brevo, ...)
#   cp web/.env.example web/.env               # web server-side secrets (Firebase Admin)
#   mkdir -p backend/secrets && cp <your-service-account>.json backend/secrets/firebase-service-account.json
#   docker compose up --build
#
# Backend http://localhost:8080 (health: /api/health) · Web http://localhost:3000 · Postgres 127.0.0.1:5432
# Flyway applies every migration (V1..V5) when the backend starts; nothing to run by hand.

name: najda

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: najda
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Bound to this machine only: the database is not meant to be reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d najda"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai:
    build: ./ai
    restart: unless-stopped
    environment:
      AI_API_KEY: ${AI_API_KEY:?set AI_API_KEY in .env}
    # no "ports": only the backend (same compose network) can reach it

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Secrets and settings come from backend/.env (see backend/.env.example); the values below win over it
    # because they only make sense inside Docker (the database host is the `postgres` service, the Firebase key
    # is mounted at a fixed path).
    env_file:
      - ./backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/najda
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FIREBASE_SERVICE_ACCOUNT_PATH: /secrets/firebase-service-account.json
      # Where a web-push notification sends the user when clicked.
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--XX:MaxRAMPercentage=75}
      AI_URL: ${AI_URL:-http://ai:8000}
      AI_API_KEY: ${AI_API_KEY}
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_HOST_PATH:-./backend/secrets/firebase-service-account.json}:/secrets/firebase-service-account.json:ro
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      # NEXT_PUBLIC_* values are compiled into the browser bundle at BUILD time, so they are build arguments
      # (read from the root .env), not runtime variables. Change one and rebuild: docker compose up --build web
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${NEXT_PUBLIC_EMAILJS_SERVICE_ID:-}
        NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${NEXT_PUBLIC_EMAILJS_TEMPLATE_ID:-}
        NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${NEXT_PUBLIC_EMAILJS_PUBLIC_KEY:-}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
        NEXT_PUBLIC_ANDROID_DOWNLOAD_URL: ${NEXT_PUBLIC_ANDROID_DOWNLOAD_URL:-}
        NEXT_PUBLIC_IOS_DOWNLOAD_URL: ${NEXT_PUBLIC_IOS_DOWNLOAD_URL:-}
        NEXT_PUBLIC_RELEASES_URL: ${NEXT_PUBLIC_RELEASES_URL:-}
        AI_URL: ${AI_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Server-side secrets only (the Firebase Admin credentials used by the Next.js server).
    env_file:
      - ./web/.env
    ports:
      - "3000:3000"

volumes:
  postgres_data:
