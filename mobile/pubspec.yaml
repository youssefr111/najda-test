name: najda
description: NAJDA mobile companion app for Citizens and Responders.
publish_to: "none"

# The release workflow overrides both values from the git tag / run number
# (--build-name / --build-number), so these only matter for local builds.
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # pinned transitively by flutter_localizations

  # State, routing, networking
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0

  # Firebase / identity
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  google_sign_in: ^6.3.0

  # Platform
  shared_preferences: ^2.5.2
  package_info_plus: ^8.3.0
  geolocator: ^13.0.2
  maplibre_gl: ^0.21.0

  # Configuration
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true # runs gen-l10n (see l10n.yaml)

  assets:
    - assets/images/
    # Only the env file that matches the build flavor is bundled into the app,
    # so a production APK never contains the test or local configuration.
    - path: env/.env.local
      flavors: [local]
    - path: env/.env.test
      flavors: [qa]
    - path: env/.env.production
      flavors: [production]
