name: najda
description: NAJDA mobile companion app for Citizens and Responders.
publish_to: "none"

# The release workflow overrides both values from the git tag / run number
# (--build-name / --build-number), so these only matter for local builds.
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # pinned transitively by flutter_localizations

  # State, routing, networking
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  stomp_dart_client: ^2.0.0

  # Firebase / identity
  firebase_core: 3.15.2
  firebase_auth: ^5.7.0
  firebase_messaging: 15.2.10
  google_sign_in: ^6.3.0

  # Platform
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  geolocator: ^14.1.1
  maplibre_gl: ^0.21.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  location: ^10.0.2
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.3
  image_picker: ^1.1.2
  record: ^6.0.0
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  path_provider: ^2.1.5
  file_picker: ^13.1.0

  # Configuration
  flutter_dotenv: ^5.2.1
  local_auth: 2.3.0
  
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter

flutter_native_splash:
  color: "#D91F26"
  image: assets/splash/splash_logo.png
  color_dark: "#D91F26"
  image_dark: assets/splash/splash_logo.png

  android: true
  ios: true

  android_12:
    color: "#D91F26"
    image: assets/splash/splash_logo_android12.png

flutter:
  uses-material-design: true
  generate: true # runs gen-l10n (see l10n.yaml)

  assets:
    - assets/images/
    # Only the env file that matches the build flavor is bundled into the app,
    # so a production APK never contains the test or local configuration.
    - path: .env.local
      flavors: [local]
    - path: .env.test
      flavors: [qa]
    - path: .env.production
      flavors: [production]