name: AI service CI

on:
  push:
    paths: ["ai/**", ".github/workflows/ai-ci.yml"]
  pull_request:
    paths: ["ai/**", ".github/workflows/ai-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Registry / export tests
        run: pytest -q
      - name: Docker image builds
        run: docker build -t najda-ai .
